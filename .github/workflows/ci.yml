name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core PHP ${{ matrix.php }} / psr/log ${{ matrix.psr-log }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.1"
            psr-log: "1.1.4"
          - php: "8.2"
            psr-log: "2.0.0"
          - php: "8.3"
            psr-log: "3.0.0"
          - php: "8.4"
            psr-log: "3.0.0"
    defaults:
      run:
        working-directory: packages/talaria
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install
        run: |
          composer require --no-update "psr/log:${{ matrix.psr-log }}"
          composer update --prefer-dist --no-interaction --no-progress
      - name: PHPStan
        if: matrix.php == '8.3'
        run: composer phpstan
      - name: PHPUnit
        run: composer test

  silverstripe:
    name: Silverstripe PHP ${{ matrix.php }} / psr/log ${{ matrix.psr-log }} / monolog ${{ matrix.monolog }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.1"
            psr-log: "1.1.4"
            monolog: "1.27.1"
          - php: "8.2"
            psr-log: "1.1.4"
            monolog: "1.27.1"
          - php: "8.1"
            psr-log: "2.0.0"
            monolog: "3.5.0"
          - php: "8.3"
            psr-log: "3.0.0"
            monolog: "3.5.0"
    defaults:
      run:
        working-directory: packages/silverstripe
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install with path core
        run: |
          composer config repositories.talaria path ../talaria
          composer remove --no-update silverstripe/framework silverstripe/vendor-plugin
          composer require --no-update "talaria/talaria:@dev" "psr/log:${{ matrix.psr-log }}" "monolog/monolog:${{ matrix.monolog }}"
          composer update --prefer-dist --no-interaction --no-progress
      - name: PHPUnit
        run: composer test

  silverstripe-framework:
    # Real silverstripe/framework installs, one per supported major. Catches
    # Injector Factory / middleware / extension signature drift (SS6 typed
    # Factory::create). SS4/5 pin older PHPUnit majors because their
    # nikic/php-parser and sebastian/diff pins rule out PHPUnit 11.
    name: Silverstripe framework ${{ matrix.framework }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: "^4.13"
            phpunit: "^10.5"
            php: "8.2"
          - framework: "^5"
            phpunit: "^9.6"
            php: "8.3"
          - framework: "^6"
            phpunit: "^11.0"
            php: "8.4"
    defaults:
      run:
        working-directory: packages/silverstripe
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none
          tools: composer:v2
      - name: Install with path core
        run: |
          composer config repositories.talaria path ../talaria
          # Every SS4/SS5 release carries a Packagist security advisory; recent
          # Composer refuses to install them unless advisory blocking is off.
          composer config policy.advisories.block false
          composer require --no-update "talaria/talaria:@dev" "silverstripe/framework:${{ matrix.framework }}"
          composer require --dev --no-update "phpunit/phpunit:${{ matrix.phpunit }}"
          composer update --prefer-dist --no-interaction --no-progress
      - name: PHPUnit
        run: composer test

  laravel:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.1"
            laravel: "10.*"
            testbench: "8.*"
          - php: "8.2"
            laravel: "11.*"
            testbench: "9.*"
          - php: "8.3"
            laravel: "12.*"
            testbench: "10.*"
    defaults:
      run:
        working-directory: packages/laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install with path core
        run: |
          composer config repositories.talaria path ../talaria
          composer require --no-update "talaria/talaria:@dev" "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress
      - name: PHPUnit
        run: composer test
